<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار نجوم الحاسوب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap');

:root{
  --canvas:#F6F4FF;
  --panel:#FFFFFF;
  --ink:#241F47;
  --ink-soft:#5C577E;
  --line:#E6E1FA;
  --gold:#F5B841;
  --gold-deep:#D98F1E;
  --danger:#E4674F;
  --shadow: 0 10px 28px -14px rgba(36,31,71,.28);
  --radius: 20px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 500px at 12% -8%, #EAE4FF 0%, transparent 60%),
    radial-gradient(900px 480px at 100% 0%, #FDEFE0 0%, transparent 55%),
    var(--canvas);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ===== Shell ===== */
#app{max-width:1280px;margin:0 auto;padding:20px 20px 60px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(120deg,#3B2E7A,#5A4AA8 55%,#7C63C9);
  color:#fff;border-radius:24px;padding:20px 26px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.topbar::before{
  content:"";position:absolute;inset:0;
  background-image: radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.5) 40%, transparent 41%),
                     radial-gradient(2px 2px at 90px 12px, rgba(255,255,255,.35) 40%, transparent 41%),
                     radial-gradient(2px 2px at 160px 45px, rgba(255,255,255,.4) 40%, transparent 41%),
                     radial-gradient(2px 2px at 240px 20px, rgba(255,255,255,.3) 40%, transparent 41%),
                     radial-gradient(2px 2px at 320px 50px, rgba(255,255,255,.4) 40%, transparent 41%);
  opacity:.8;pointer-events:none;
}
.topbar-title{position:relative;z-index:1;}
.topbar-title h1{margin:0;font-size:26px;font-weight:800;}
.topbar-title p{margin:4px 0 0;font-size:13.5px;color:#DCD5FF;font-weight:500;}
.topbar-user{
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-badge{
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}

/* ===== Buttons ===== */
.btn{
  border:none;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s transform ease, .15s box-shadow ease;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--gold);color:#3B2A0A;box-shadow:0 6px 16px -6px rgba(217,143,30,.6);}
.btn-primary:hover{box-shadow:0 8px 18px -6px rgba(217,143,30,.75);}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.22);}
.btn-soft{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);}
.btn-soft:hover{border-color:#C9BFF5;}
.btn-accent{background:#7C63C9;color:#fff;}
.btn-accent:hover{background:#684FA8;}
.btn-danger{background:#FCE7E2;color:#B23E28;}
.btn-danger:hover{background:#FAD8CF;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:10px;}
.icon-btn{
  width:32px;height:32px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.85);color:var(--ink-soft);font-size:15px;
}
.icon-btn:hover{background:#fff;color:var(--danger);}

/* ===== Loading ===== */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--ink-soft);gap:14px;}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #E1DAFA;border-top-color:#7C63C9;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Classes grid ===== */
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px;}
.section-heading h2{margin:0;font-size:19px;font-weight:800;}
.section-heading span{color:var(--ink-soft);font-size:13px;font-weight:500;}

.classes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.class-card{
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:20px;position:relative;box-shadow:var(--shadow);cursor:pointer;transition:.15s transform ease,.15s border-color ease;
}
.class-card:hover{transform:translateY(-3px);border-color:#C9BFF5;}
.class-card .cc-remove{position:absolute;top:12px;left:12px;}
.class-card .cc-icon{font-size:30px;}
.class-card h3{margin:10px 0 4px;font-size:18px;}
.class-card .cc-meta{color:var(--ink-soft);font-size:12.5px;display:flex;gap:12px;margin-top:8px;}
.class-card .cc-total{
  margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#FFF6E4;color:var(--gold-deep);
  padding:5px 12px;border-radius:100px;font-weight:700;font-size:13px;
}

.add-class-card{
  border:2px dashed #C9BFF5;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:26px;color:#7C63C9;font-weight:700;background:rgba(124,99,201,.04);
  min-height:150px;transition:.15s;
}
.add-class-card:hover{background:rgba(124,99,201,.09);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ee-emoji{font-size:44px;display:block;margin-bottom:10px;}
.empty-state h3{color:var(--ink);margin:0 0 6px;}

/* ===== Class detail ===== */
.detail-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 16px;flex-wrap:wrap;}
.detail-header .dh-left{display:flex;align-items:center;gap:10px;}
.back-btn{background:var(--panel);border:1.5px solid var(--line);}
.class-title{display:flex;align-items:center;gap:8px;}
.class-title h2{margin:0;font-size:22px;}
.class-title button{background:none;border:none;color:var(--ink-soft);font-size:15px;}
.class-title button:hover{color:#7C63C9;}

.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}

/* ===== Tabs ===== */
.tab-nav{display:flex;gap:8px;border-bottom:2px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{
  padding:10px 18px;border:none;background:none;font-weight:700;font-size:15px;color:var(--ink-soft);
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;
}
.tab-btn.active{color:#7C63C9;border-bottom-color:#7C63C9;}

/* ===== Top 3 Podium Section ===== */
.top-three-wrapper{
  background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
  border: 2px solid rgba(245, 184, 65, 0.4);
  border-radius: 26px;
  padding: 28px 20px 24px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 16px 36px -10px rgba(49, 46, 129, 0.45);
}
.top-three-wrapper::before{
  content:"";
  position:absolute;
  top:-50%; left:-50%; width:200%; height:200%;
  background: radial-gradient(circle, rgba(245,184,65,0.18) 0%, transparent 55%);
  pointer-events:none;
}
.top-three-title{
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}
.top-three-title .title-text{
  background: linear-gradient(90deg, #FFE259, #FFA751);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Cairo', sans-serif;
  letter-spacing: .3px;
}
.top-three-container{
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 18px;
  position: relative;
  z-index: 1;
}
.podium-card{
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  padding: 22px 14px 18px;
  text-align: center;
  box-shadow: 0 12px 28px rgba(0,0,0,0.22);
  flex: 1;
  min-width: 150px;
  max-width: 210px;
  position: relative;
  transition: transform .2s ease;
}
.podium-card:hover{
  transform: translateY(-5px);
}
.podium-1{
  order: 2;
  border: 3px solid #F5B841;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF0 100%);
  transform: scale(1.08);
  box-shadow: 0 16px 36px rgba(245, 184, 65, 0.4);
  z-index: 2;
}
.podium-1:hover{
  transform: scale(1.1) translateY(-5px);
}
.podium-2{
  order: 1;
  border: 2px solid #CBD5E1;
  background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.podium-3{
  order: 3;
  border: 2px solid #E28743;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF8F5 100%);
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.rank-badge{
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  background: #ffffff;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  border: 2px solid #F5B841;
}
.podium-2 .rank-badge{ border-color: #94A3B8; }
.podium-3 .rank-badge{ border-color: #D97706; }

.podium-title{
  font-size: 13px;
  font-weight: 800;
  margin-top: 10px;
  font-family: 'Cairo', sans-serif;
}
.podium-1 .podium-title{ color: #D98F1E; }
.podium-2 .podium-title{ color: #64748B; }
.podium-3 .podium-title{ color: #B45309; }

.podium-avatar{
  margin: 10px auto 8px;
  width: 58px;
  height: 58px;
  font-size: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  color: #fff;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}
.podium-1 .podium-avatar{
  width: 66px;
  height: 66px;
  font-size: 34px;
  border: 3px solid #F5B841;
  box-shadow: 0 6px 16px rgba(245, 184, 65, 0.45);
}

.podium-name{
  font-weight: 800;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 4px;
}

.podium-points{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #FFF7ED;
  border: 1.5px solid #FFEDD5;
  color: #D97706;
  padding: 4px 12px;
  border-radius: 100px;
  font-weight: 800;
  font-size: 13px;
}
.podium-1 .podium-points{
  background: #FEF3C7;
  border-color: #FDE68A;
  color: #B45309;
  font-size: 14px;
  padding: 5px 14px;
}

/* ===== Student Cards Grid ===== */
.students-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:12px;
}

.student-card{
  background:var(--panel);
  border-radius:var(--radius);
  padding:18px;
  position:relative;
  box-shadow:var(--shadow);
  border-top:5px solid var(--sc,#7C63C9);
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:.15s transform ease;
  height:200px;
}
.student-card:hover{transform:translateY(-3px);}

.student-card .st-remove{
  position:absolute;
  top:14px;
  left:14px;
  background:none;
  border:none;
  font-weight:800;
  font-size:16px;
  color:var(--ink-soft);
  cursor:pointer;
  padding:0;
  line-height:1;
  z-index:2;
}
.student-card .st-remove:hover{color:var(--danger);}

.student-card .student-avatar{
  position:absolute;
  top:12px;
  right:14px;
  width:46px;
  height:46px;
  border-radius:14px;
  background:color-mix(in srgb, var(--sc,#7C63C9) 16%, white);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:0;
}

.student-card .student-top-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  min-height:32px;
  margin-top:4px;
  margin-bottom:10px;
  padding-inline:52px 4px;
}

.student-card .student-name{
  font-family:'Cairo',sans-serif;
  font-weight:800;
  font-size:15.5px;
  color:var(--ink);
  text-align:center;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-card .st-edit-icon{
  flex-shrink:0;
  width:26px;
  height:26px;
  border-radius:8px;
  border:1px solid var(--line);
  background:#F9F8FF;
  color:var(--ink-soft);
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}
.student-card .st-edit-icon:hover{color:#7c63c9;border-color:#C9BFF5;}

.student-card .student-info-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:12px;
  font-weight:700;
  color:var(--ink-soft);
  background:#F9F8FF;
  padding:5px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-card .student-stats-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  margin-top:14px;
  gap:8px;
}

.student-card .student-points-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1;
}
.student-card .student-points-center b{
  font-size:22px;
  font-family:'Cairo',sans-serif;
  color:var(--ink);
}
.student-card .student-points-center span{
  font-size:10.5px;
  color:var(--ink-soft);
  margin-top:3px;
}

.student-card .st-btn-plus{
  width:34px;
  height:34px;
  border-radius:11px;
  border:none;
  background:#EBE7FF;
  color:#4a3ba8;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.1s transform;
  flex-shrink:0;
}
.student-card .st-btn-plus:active{transform:scale(.92);}

.student-card .st-btn-minus{
  width:34px;
  height:34px;
  border-radius:11px;
  border:none;
  background:#FCE7E2;
  color:#B23E28;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.1s transform;
  flex-shrink:0;
}
.student-card .st-btn-minus:active{transform:scale(.92);}

/* ===== Groups grid ===== */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.group-card{
  background:var(--panel);border-radius:var(--radius);padding:18px;position:relative;
  box-shadow:var(--shadow);border-top:5px solid var(--gc,#7C63C9);
}
.group-card .gc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.gc-badge{
  width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:color-mix(in srgb, var(--gc,#7C63C9) 16%, white);
}
.gc-name-row{flex:1;margin-inline-start:12px;}
.gc-name{
  border:none;background:transparent;font-family:'Cairo',sans-serif;font-weight:800;font-size:16.5px;
  color:var(--ink);width:100%;padding:2px 0;border-bottom:1.5px dashed transparent;
}
.gc-name:focus{outline:none;border-bottom-color:var(--gc,#7C63C9);}
.gc-leader{
  border:none;background:transparent;font-size:12.5px;color:var(--ink-soft);width:100%;margin-top:2px;
  border-bottom:1.5px dashed transparent;padding:2px 0;
}
.gc-members-box{
  margin-top:12px;background:#F9F8FF;padding:10px;border-radius:12px;border:1px solid var(--line);
  font-size:12px;
}
.gc-members-title{font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.gc-members-list{display:flex;flex-wrap:wrap;gap:4px;}
.member-tag{
  background:#fff;border:1px solid #DCD5FF;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;
}
.member-tag button{
  background:none;border:none;color:#B23E28;font-weight:800;cursor:pointer;padding:0;font-size:12px;
}

.gc-stars{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px;}
.gc-star-btn{
  width:34px;height:34px;border-radius:11px;border:none;font-size:18px;font-weight:800;
  background:#F1EEFB;color:var(--ink);
}
.gc-star-btn:active{transform:scale(.9);}
.gc-star-btn.minus{color:#B23E28;background:#FCE7E2;}
.gc-star-count{display:flex;flex-direction:column;align-items:center;line-height:1;}
.gc-star-count b{font-size:24px;font-family:'Cairo',sans-serif;}
.gc-star-count span{font-size:11px;color:var(--ink-soft);margin-top:2px;}

.gc-track{margin-top:14px;}
.gc-track-bar{height:10px;border-radius:100px;background:#F0EEFA;position:relative;overflow:visible;}
.gc-track-fill{
  position:absolute;top:0;right:0;height:100%;border-radius:100px;
  background:linear-gradient(90deg, var(--gc,#7C63C9), var(--gold));transition:width .4s ease;
}
.gc-track-icon{
  position:absolute;top:50%;transform:translate(50%,-50%);font-size:16px;transition:right .4s ease;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.gc-track-flag{position:absolute;left:-2px;top:50%;transform:translate(-40%,-60%);font-size:15px;}
.gc-milestones{display:flex;justify-content:space-between;margin-top:8px;}
.gc-milestone{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.35;}
.gc-milestone.done{opacity:1;}
.gc-milestone .m-icon{font-size:14px;}
.gc-milestone .m-label{font-size:9.5px;color:var(--ink-soft);white-space:nowrap;}

.gc-remove{position:absolute;top:12px;left:12px;}

.add-card{
  border:2px dashed #C9BFF5;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;color:#7C63C9;font-weight:700;background:rgba(124,99,201,.04);
  min-height:160px;cursor:pointer;transition:.15s;
}
.add-card:hover{background:rgba(124,99,201,.09);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(36,31,71,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;
}
.modal{
  background:#fff;border-radius:22px;padding:24px;width:100%;max-width:520px;box-shadow:0 24px 60px -18px rgba(36,31,71,.5);
  max-height:90vh;overflow-y:auto;
}
.modal h3{margin:0 0 4px;font-size:18px;}
.modal p.sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text], .field input[type=password], .field input[type=date], .field textarea, .field select{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--ink);
  background:#fff;
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:#7C63C9;}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatch{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;
  border:2px solid transparent;background:#F6F4FF;cursor:pointer;
}
.swatch.selected{border-color:var(--ink);background:#E1DAFA;}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

/* ===== Wheel & Random Pick Canvas ===== */
.wheel-container{display:flex;flex-direction:column;align-items:center;position:relative;margin-top:10px;}
.wheel-pointer{
  width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:22px solid #E4674F;position:absolute;top:-10px;z-index:10;

<body>

<!-- Main System Shell -->
<div id="app" style="display:none;">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div>جارِ تحميل مسار النجوم...</div>
  </div>
</div>

<script>
/* ============ Storage Config (بدون تسجيل دخول - قاعدة بيانات مشتركة واحدة) ============ */
const FIREBASE_BASE = 'https://schoolproject-97946-default-rtdb.firebaseio.com';
const DATA_PATH = `${FIREBASE_BASE}/app-data.json`;
const LOCAL_DATA_KEY = 'reward-tracker-state';

function showApp(){
  document.getElementById('app').style.display = 'block';
  initSystem();
}

/* ============ Storage helpers ============ */
let lastSyncedAt = null;
let syncStatus = 'unknown';

function fetchWithTimeout(url, options = {}, timeoutMs = 6000){
  // ملاحظة: تم تفادي استخدام AbortController/AbortSignal هنا عمداً لأن بعض بيئات
  // المعاينة المحمية (sandboxed iframe) تفشل عند محاولة نسخ AbortSignal عبر postMessage
  // مما يسبب الخطأ: DataCloneError: Failed to execute 'postMessage' ... AbortSignal object could not be cloned.
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) => setTimeout(()=>reject(new Error('انتهت مهلة الاتصال بقاعدة البيانات')), timeoutMs))
  ]);
}

function localGet(){
  try{
    const raw = window.localStorage.getItem(LOCAL_DATA_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function localSet(){
  try{ window.localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Local backup save failed', e); }
}

async function loadRemoteState(){
  try{
    const result = await Promise.race([
      fetchWithTimeout(DATA_PATH, { cache:'no-store' }, 6000).then(async res=>{
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      }),
      new Promise(resolve => setTimeout(()=>resolve({__timedOut:true}), 6500))
    ]);
    if(result && result.__timedOut) throw new Error('Firebase request timed out');
    lastSyncedAt = new Date();
    syncStatus = 'online';
    if(result && typeof result === 'object'){
      return { classes: Array.isArray(result.classes) ? result.classes : [], activeClassId: result.activeClassId || null };
    }
    return { classes: [], activeClassId: null };
  }catch(e){
    console.error('Firebase load error', e);
    syncStatus = 'offline';
    return null;
  }
}

let saving = false, pendingSave = false;
async function saveState(){
  if(saving){ pendingSave = true; return; }
  saving = true;
  localSet();
  try{
    const res = await fetchWithTimeout(DATA_PATH, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lastSyncedAt = new Date();
    syncStatus = 'online';
  }catch(e){
    console.error('Firebase save error', e);
    syncStatus = 'offline';
  }finally{
    updateSyncBadge();
    saving = false;
    if(pendingSave){ pendingSave = false; saveState(); }
  }
}

async function manualRefresh(){
  showToast('جارِ إعادة المحاولة...');
  const remote = await loadRemoteState();
  if(remote){
    state = remote;
    if(state.activeClassId && !state.classes.find(c=>c.id===state.activeClassId)){
      state.activeClassId = null; view = 'home';
    }
    localSet();
  }
  render();
  showToast(syncStatus === 'online' ? 'تم الاتصال بقاعدة البيانات ✅' : 'ما زال الاتصال غير متاح، يتم الحفظ محليًا');
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(syncStatus === 'online'){
    el.textContent = '✅ متصل — آخر مزامنة: ' + (lastSyncedAt ? lastSyncedAt.toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'}) : '');
    el.style.color = '#C9F5DA';
  } else if(syncStatus === 'offline'){
    el.textContent = '⚠️ غير متصل بقاعدة البيانات — يتم الحفظ محليًا';
    el.style.color = '#FFD9C9';
  } else {
    el.textContent = '';
  }
}

/* ============ Constants & State ============ */
let state = { classes: [], activeClassId: null };
let view = 'home'; 
let activeTab = 'students'; // 'students' | 'groups'
let pendingModal = null;
let hideTopThree = false;

const STUDENT_AVATARS = ['🦸‍♀️', '🧝‍♀️', '🧙‍♀️', '🧚‍♀️', '👩‍🚀', '👩‍🔬', '👩‍🎨', '👸', '🦄', '🐱', '🦊', '🐰', '🐼', '🧜‍♀️', '🐥', '🦋', '🐝', '🐬', '🦁', '🐻', '👑', '⭐', '💻', '🚀'];

const PRESET_GROUPS = [
  {name:'الروبوتات', icon:'🤖', color:'#8C7AE6'},
  {name:'المبدعات', icon:'💡', color:'#F080A0'},
  {name:'المبتكرات', icon:'🚀', color:'#3FBFBF'},
  {name:'العبقريات', icon:'🧠', color:'#A78BFA'},
  {name:'المستكشفات', icon:'🔎', color:'#F5934D'},
  {name:'المحترفات', icon:'🏆', color:'#6FBF73'},
  {name:'المتميزات', icon:'🌟', color:'#F0C136'},
  {name:'النجمات', icon:'⭐', color:'#5B9EE1'},
];

const ICON_CHOICES = ['🤖','💡','🚀','🧠','🔎','🏆','🌟','⭐','👩‍💻','🎯','⚡','🎨','🔬','🛰️','🧩','🎮'];
const COLOR_CHOICES = ['#8C7AE6','#F080A0','#3FBFBF','#A78BFA','#F5934D','#6FBF73','#F0C136','#5B9EE1','#E4674F','#5CC29E'];

const MILESTONES = [
  {stars:20, icon:'🎫', label:'بطاقة تشجيعية'},
  {stars:30, icon:'🎁', label:'سحب مفاجأة'},
  {stars:40, icon:'✨', label:'امتياز جماعي'},
  {stars:50, icon:'🏆', label:'قاعة النجوم'},
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function initSystem(){
  const remote = await loadRemoteState();
  if(remote){
    state = remote;
  } else {
    state = localGet() || { classes: [], activeClassId: null };
  }
  render();
}

showApp();

let toastTimer;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function sanitizeClass(c){
  if(!Array.isArray(c.groups)) c.groups = [];
  if(!Array.isArray(c.students)) c.students = [];
}

function render(){
  const app = document.getElementById('app');
  state.classes.forEach(sanitizeClass);
  const activeClass = state.classes.find(c=>c.id===state.activeClassId);

  let html = `
    <div class="topbar">
      <div class="topbar-title">
        <h1>💻⭐ مسار نجوم الحاسوب</h1>
        <p>كل نجمة تقربنا من قمة الإنجاز</p>
        <p id="syncBadge" style="opacity:.9;font-size:11px;margin-top:6px;font-weight:700;"></p>
      </div>
      <div class="topbar-user">
        <button class="icon-btn" id="refreshSyncBtn" title="تحديث">🔄</button>
      </div>
    </div>
  `;

  if(view === 'home' || !activeClass){
    html += renderHome();
  } else {
    html += renderClassDetail(activeClass);
  }

  html += `<footer class="note">تُحفظ جميع البيانات تلقائيًا في قاعدة البيانات</footer>`;

  app.innerHTML = html;
  updateSyncBadge();

  const refreshBtn = document.getElementById('refreshSyncBtn');
  if(refreshBtn) refreshBtn.onclick = manualRefresh;

  wireHomeOrDetail(activeClass);

  if(pendingModal){
    document.body.insertAdjacentHTML('beforeend', pendingModal.html);
    pendingModal.wire();
  }
}

function renderHome(){
  let html = `<div class="section-heading"><h2>الشُّعب</h2><span>${state.classes.length} شعبة</span></div>`;

  if(state.classes.length === 0){
    html += `
      <div class="empty-state">
        <span class="ee-emoji">🗂️</span>
        <h3>لا توجد شُعب بعد</h3>
        <p>أضيفي أول شعبة لتبدأ رحلة النجوم</p>
        <button class="btn btn-primary" id="addClassBtn" style="margin-top:10px;">+ إضافة شعبة</button>
      </div>`;
    return html;
  }

  html += `<div class="classes-grid">`;
  state.classes.forEach(c=>{
    const totalG = c.groups.reduce((s,g)=>s+g.stars,0);
    const totalS = c.students.reduce((s,st)=>s+(st.points||0),0);
    html += `
      <div class="class-card" data-open-class="${c.id}">
        <button class="icon-btn cc-remove" data-remove-class="${c.id}" title="حذف الشعبة">✕</button>
        <div class="cc-icon">🏫</div>
        <h3>${escapeHtml(c.name)}</h3>
        <div class="cc-meta">
          <span>👩‍🎓 ${c.students.length} طالبة</span>
          <span>👥 ${c.groups.length} مجموعة</span>
        </div>
        <div class="cc-total">⭐ ${totalG + totalS} نجمة ونقطة</div>
      </div>`;
  });
  html += `
      <div class="class-card add-class-card" id="addClassBtn">
        <div style="font-size:28px;">+</div>
        <div>إضافة شعبة</div>
      </div>
    `;
  return html;
}

function renderClassDetail(cls){
  let html = `
    <div class="detail-header">
      <div class="dh-left">
        <button class="icon-btn back-btn" id="backHomeBtn" title="رجوع">→</button>
        <div class="class-title">
          <h2>${escapeHtml(cls.name)}</h2>
          <button id="renameClassBtn" title="إعادة تسمية">✎</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-soft btn-sm" id="backHomeBtnLabeled">🏠 العودة إلى جميع الشُّعب</button>
        <button class="btn btn-danger btn-sm" id="removeClassBtnDetail">حذف الشعبة</button>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary" id="openWheelBtn">🎡 العجلة الدوارة</button>
      <button class="btn btn-accent" id="openQuickPickBtn">🎲 اختيار عشوائي سريع</button>
      <button class="btn btn-soft" id="openDevicePickBtn">💻 اختيار عشوائي برقم الجهاز</button>

    <div class="tab-nav">

      <button class="tab-btn ${activeTab==='groups'?'active':''}" id="tabGroupsBtn">👥 إدارة المجموعات (${cls.groups.length})</button>
    </div>
  `;

  if(activeTab === 'groups'){
    html += renderGroupsTab(cls);
  } else {
    html += renderStudentsTab(cls);
  }

  return html;
}

function renderStudentsTab(cls){
  let html = `
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="addStudentBtn">+ إضافة طالبة فردية</button>
        <button class="btn btn-soft" id="bulkAddStudentBtn">📋 إضافة جماعية</button>
      </div>
      <button class="btn btn-soft btn-sm" id="toggleTopThreeBtn">
        ${hideTopThree ? '👁️ إظهار المراكز الثلاثة الأولى' : '🙈 إخفاء المراكز الثلاثة الأولى'}
      </button>
    </div>
  `;

  if(cls.students.length === 0){
    html += `
      <div class="empty-state">
        <span class="ee-emoji">👩‍🎓</span>
        <h3>لا توجد طالبات في هذه الشعبة</h3>
      </div>`;
    return html;
  }

  const sortedStudents = [...cls.students].sort((a,b) => (b.points || 0) - (a.points || 0));
  const top3 = sortedStudents.filter(s => (s.points || 0) > 0).slice(0, 3);

  if(top3.length > 0 && !hideTopThree){
    const medals = ['🥇', '🥈', '🥉'];
    const titles = ['المركز الأول', 'المركز الثاني', 'المركز الثالث'];
    const podiumClasses = ['podium-1', 'podium-2', 'podium-3'];

    html += `
      <div class="top-three-wrapper">
        <div class="top-three-title">
          <span>✨</span>
          <span class="title-text">المراكز الثلاثة الأولى في التعزيز الفردي</span>
          <span>🏆</span>
        </div>
        <div class="top-three-container">`;
    
    top3.forEach((st, idx) => {
      html += `
        <div class="podium-card ${podiumClasses[idx]}">
          <div class="rank-badge">${medals[idx]}</div>
          <div class="podium-title">${titles[idx]}</div>
          <div class="podium-avatar">${st.avatar || '👩‍🎓'}</div>
          <div class="podium-name">${escapeHtml(st.name)}</div>
          <div class="podium-points">⭐ ${st.points || 0} نقطة</div>
        </div>`;
    });

    html += `
        </div>
      </div>`;
  }

  html += `<div class="students-grid">`;
  cls.students.forEach(st => {
    html += `
      <div class="student-card">
        <button class="st-remove" data-remove-student="${st.id}" title="حذف">X</button>
        <div class="student-avatar">${st.avatar || '👩‍🎓'}</div>
        <div class="student-top-row">
          <div class="student-name" title="${escapeAttr(st.name)}">${escapeHtml(firstTwoNames(st.name))}</div>
          <button class="st-edit-icon" data-edit-student="${st.id}" title="تعديل">✏️</button>
        </div>
        <div class="student-info-badge">💻 جهاز: ${st.deviceNum ? escapeHtml(st.deviceNum) : '-'}</div>
        <div class="student-stats-row">
          <button class="st-btn-plus" data-st-delta="1" data-student="${st.id}">+</button>
          <div class="student-points-center">
            <b>⭐ ${st.points || 0}</b>
            <span>نقطة</span>
          </div>
          <button class="st-btn-minus" data-st-delta="-1" data-student="${st.id}">-</button>
        </div>
      </div>`;
  });

  html += `
      <div class="add-card" id="gridAddStudentBtn">
        <div style="font-size:26px;">+</div>
        <div>إضافة طالبة</div>
      </div>
    </div>`;

  return html;
}

function renderGroupsTab(cls){
  let html = `
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="addGroupBtn">+ إضافة مجموعة جديدة</button>
        <button class="btn btn-soft" id="quickAddBtn">✨ المجموعات الثماني الجاهزة</button>
      </div>
    </div>
  `;

  if(cls.groups.length === 0){
    html += `
      <div class="empty-state">

  }

  html += `<div class="groups-grid">`;

          <div class="gc-badge">${g.icon}</div>

            <input class="gc-name" data-field="name" data-group="${g.id}" value="${escapeAttr(g.name)}" maxlength="24">

          </div>
        </div>

        <div class="gc-stars">
          <button class="gc-star-btn minus" data-star-delta="-1" data-group="${g.id}">−</button>
          <div class="gc-star-count"><b>⭐ ${g.stars}</b><span>نجوم المجموعة</span></div>

            <div class="gc-track-flag">🏁</div>
          </div>
          <div class="gc-milestones">
            ${MILESTONES.map(m=>`
              <div class="gc-milestone ${g.stars>=m.stars?'done':''}">
                <span class="m-icon">${m.icon}</span>
                <span class="m-label">${m.stars}</span>
              </div>`).join('')}
          </div>
        </div>

        <div class="gc-members-box">
            <button class="btn btn-primary btn-sm" data-manage-group-members="${g.id}" style="padding:4px 10px;font-size:11.5px;">⚙️ </button>
          <div class="gc-members-list">
            ${groupStudents.length > 0 
              ? groupStudents.map(st=>`
                  <span class="member-tag">
                    ${st.avatar || '👩‍🎓'} ${escapeHtml(st.name)}
                    <button data-remove-from-group="${st.id}" title="إزالة من المجموعة">✕</button>
                  </span>`).join('') 
              : '<span style="color:#B7B2D6;font-size:11px;">لا توجد طالبات في هذه المجموعة بعد</span>'}
          </div>
        </div>
      </div>`;
  });

  html += `
      <div class="add-card" id="addGroupCardBtn">
        <div style="font-size:26px;">+</div>
        <div>إضافة مجموعة</div>
      </div>
    `;

  return html;
}

function wireHomeOrDetail(activeClass){
  const addClassBtn = document.getElementById('addClassBtn');
  if(addClassBtn) addClassBtn.onclick = openAddClassModal;

  document.querySelectorAll('[data-open-class]').forEach(el=>{
    el.onclick = ()=>{
      state.activeClassId = el.getAttribute('data-open-class');
      view = 'class';
      render();
    };
  });

  document.querySelectorAll('[data-remove-class]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-remove-class');
      const c = state.classes.find(x=>x.id===id);
      openConfirmModal(`حذف "${c.name}"؟`, 'سيتم حذف جميع محتوياتها.', ()=>{
        state.classes = state.classes.filter(x=>x.id!==id);
        if(state.activeClassId===id){ state.activeClassId=null; view='home'; }
        saveState(); render();
        showToast('تم حذف الشعبة');
      });
    };
  });

  if(!activeClass) return;

  const goHome = ()=>{ view='home'; state.activeClassId=null; render(); };

  const backBtn = document.getElementById('backHomeBtn');
  if(backBtn) backBtn.onclick = goHome;

  const backBtnLabeled = document.getElementById('backHomeBtnLabeled');
  if(backBtnLabeled) backBtnLabeled.onclick = goHome;

  const renameBtn = document.getElementById('renameClassBtn');
  if(renameBtn) renameBtn.onclick = ()=>openRenameClassModal(activeClass);

  const removeClassDetailBtn = document.getElementById('removeClassBtnDetail');
  if(removeClassDetailBtn) removeClassDetailBtn.onclick = ()=>{
    openConfirmModal(`حذف "${activeClass.name}"؟`, 'نهائياً', ()=>{
      state.classes = state.classes.filter(x=>x.id!==activeClass.id);
      state.activeClassId = null; view='home';
      saveState(); render();
      showToast('تم حذف الشعبة');
    });
  };

  const tabStudentsBtn = document.getElementById('tabStudentsBtn');
  if(tabStudentsBtn) tabStudentsBtn.onclick = ()=>{ activeTab='students'; render(); };

  const tabGroupsBtn = document.getElementById('tabGroupsBtn');
  if(tabGroupsBtn) tabGroupsBtn.onclick = ()=>{ activeTab='groups'; render(); };

  const openWheelBtn = document.getElementById('openWheelBtn');
  if(openWheelBtn) openWheelBtn.onclick = ()=>openWheelModal(activeClass);

  const openQuickPickBtn = document.getElementById('openQuickPickBtn');
  if(openQuickPickBtn) openQuickPickBtn.onclick = ()=>openQuickPickModal(activeClass);

  const openDevicePickBtn = document.getElementById('openDevicePickBtn');

  if(bulkAddStudentBtn) bulkAddStudentBtn.onclick = ()=>openBulkAddStudentsModal(activeClass);

    el.onclick = ()=>{
      const stid = el.getAttribute('data-edit-student');
      const st = activeClass.students.find(x=>x.id===stid);
      if(st) openStudentModal(activeClass, st);
    };
  });

  document.querySelectorAll('[data-st-delta]').forEach(el=>{
    el.onclick = ()=>{
      const stid = el.getAttribute('data-student');
      const delta = parseInt(el.getAttribute('data-st-delta'), 10);
      const st = activeClass.students.find(x=>x.id===stid);
      if(st){
        st.points = Math.max(0, (st.points||0) + delta);
        saveState();
        render();
      }
    };
  });

  document.querySelectorAll('[data-remove-student]').forEach(el=>{
    el.onclick = ()=>{
      const stid = el.getAttribute('data-remove-student');
      const st = activeClass.students.find(x=>x.id===stid);
      openConfirmModal(`حذف الطالبة "${st.name}"؟`, '', ()=>{
        activeClass.students = activeClass.students.filter(x=>x.id!==stid);
        saveState(); render();
        showToast('تم حذف الطالبة');
      });
    };
  });

  const addGroupBtn = document.getElementById('addGroupBtn');
  if(addGroupBtn) addGroupBtn.onclick = ()=>openAddGroupModal(activeClass);

  const addGroupCardBtn = document.getElementById('addGroupCardBtn');
  if(addGroupCardBtn) addGroupCardBtn.onclick = ()=>openAddGroupModal(activeClass);

  const quickAddBtn = document.getElementById('quickAddBtn');

  };

  document.querySelectorAll('[data-manage-group-members]').forEach(el=>{
    el.onclick = ()=>{
      const gid = el.getAttribute('data-manage-group-members');
      const group = activeClass.groups.find(g=>g.id===gid);
      if(group) openManageGroupMembersModal(activeClass, group);
    };
  });

  document.querySelectorAll('[data-remove-from-group]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const stid = el.getAttribute('data-remove-from-group');
      const st = activeClass.students.find(s=>s.id===stid);
      if(st){
        st.groupId = '';
        saveState();
        render();
        showToast('تمت إزالة الطالبة من المجموعة');
      }
    };
  });

  document.querySelectorAll('[data-remove-group]').forEach(el=>{
    el.onclick = ()=>{
      const gid = el.getAttribute('data-remove-group');
      const g = activeClass.groups.find(x=>x.id===gid);
      openConfirmModal(`حذف مجموعة "${g.name}"؟`, '', ()=>{
        activeClass.groups = activeClass.groups.filter(x=>x.id!==gid);
        activeClass.students.forEach(s => { if(s.groupId === gid) s.groupId = ''; });
        saveState(); render();
        showToast('تم حذف المجموعة');
      });
    };
  });

  document.querySelectorAll('[data-star-delta]').forEach(el=>{
    el.onclick = ()=>{
      const gid = el.getAttribute('data-group');
      const delta = parseInt(el.getAttribute('data-star-delta'),10);
      const g = activeClass.groups.find(x=>x.id===gid);
      g.stars = Math.max(0, g.stars + delta);
      saveState();
      render();
    };
  });

  document.querySelectorAll('input[data-field]').forEach(el=>{
    el.oninput = ()=>{
      const gid = el.getAttribute('data-group');
      const field = el.getAttribute('data-field');
      const g = activeClass.groups.find(x=>x.id===gid);
      if(g) g[field] = el.value;
    };
    el.onblur = ()=>{ saveState(); };
  });

}

function openWheelModal(cls){
  if(!cls.students || cls.students.length === 0){
    showToast('⚠️ لا توجد طالبات');
    return;
  }
  let isSpinning = false;
  let currentAngle = 0;

  pendingModal = {
    html: `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal" style="max-width:480px;text-align:center;">
          <h3>🎡 العجلة الدوارة</h3>
          <div class="field" style="text-align:right;">
            <select id="wheelGroupFilter">
              <option value="all">جميع الطالبات (${cls.students.length})</option>
              ${cls.groups.map(g => `<option value="${g.id}">مجموعة: ${escapeHtml(g.name)}</option>`).join('')}
            </select>
          </div>
          <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
          </div>
          <div id="winnerContainer"></div>
          <div class="modal-actions" style="justify-content:center;margin-top:20px;">
            <button class="btn btn-soft" id="closeWheelBtn">إغلاق</button>
            <button class="btn btn-primary" id="spinWheelBtn">أدر العجلة 🚀</button>
          </div>
        </div>
      </div>`,
    wire: ()=>{
      const handleClose = ()=>{ closeModal(); render(); };
      document.getElementById('closeWheelBtn').onclick = handleClose;
      document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay' && !isSpinning) handleClose(); };
      
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const groupSelect = document.getElementById('wheelGroupFilter');

      function getFilteredStudents(){
        const val = groupSelect.value;
        if(val === 'all') return cls.students;
        return cls.students.filter(s => s.groupId === val);
      }

      let currentStudents = getFilteredStudents();

      function drawWheel(){
        ctx.clearRect(0, 0, 300, 300);
        const total = currentStudents.length;
        if(total === 0) return;
        const arc = (2 * Math.PI) / total;
        const radius = 145, cx = 150, cy = 150;
        const colors = ['#8C7AE6', '#F080A0', '#3FBFBF', '#A78BFA', '#F5934D', '#6FBF73', '#F0C136', '#5B9EE1', '#E4674F', '#5CC29E'];

        for(let i = 0; i < total; i++){
          const angle = currentAngle + i * arc;
          ctx.beginPath();
          ctx.fillStyle = colors[i % colors.length];
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, radius, angle, angle + arc);
          ctx.lineTo(cx, cy);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle + arc / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 13px Tajawal, sans-serif";
          ctx.fillText(currentStudents[i].name.slice(0, 14), radius - 15, 4);
          ctx.restore();
        }
      }

      groupSelect.onchange = ()=>{
        currentStudents = getFilteredStudents();
        currentAngle = 0;
        document.getElementById('winnerContainer').innerHTML = '';
        drawWheel();
      };
      drawWheel();

      document.getElementById('spinWheelBtn').onclick = ()=>{
        if(isSpinning) return;
        currentStudents = getFilteredStudents();
        if(currentStudents.length === 0) return;
        isSpinning = true; groupSelect.disabled = true;
        document.getElementById('winnerContainer').innerHTML = '';
        
        const spinRounds = 5 + Math.random() * 5;
        const targetAngle = currentAngle + spinRounds * 2 * Math.PI + Math.random() * 2 * Math.PI;
        const duration = 3800;
        const start = performance.now();
        const startAngle = currentAngle;

        function animate(now){
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
          drawWheel();

          if(progress < 1){
            requestAnimationFrame(animate);
          } else {
            isSpinning = false; groupSelect.disabled = false;
            const total = currentStudents.length;
            const arc = (2 * Math.PI) / total;
            const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
            const topAngle = (normalizedAngle + 1.5 * Math.PI) % (2 * Math.PI);
            const winnerIndex = Math.floor(topAngle / arc) % total;
            const winner = currentStudents[winnerIndex];

            document.getElementById('winnerContainer').innerHTML = `
              <div class="winner-box">
                <div style="font-size:38px;">${winner.avatar || '🎉'}</div>
                <h3 style="margin:6px 0 2px;">مبروك: ${escapeHtml(winner.name)} ✨</h3>
                <button class="btn btn-primary btn-sm" id="awardWinnerBtn" style="margin-top:10px;">+ منح نقطة ⭐</button>
              </div>`;
            
            document.getElementById('awardWinnerBtn').onclick = (e)=>{
              winner.points = (winner.points || 0) + 1;
              saveState();
              showToast(`تم إضافة نقطة لـ ${winner.name}`);
              e.target.textContent = `+ منح نقطة أخرى (النقاط: ${winner.points})`;
            };
          }
        }
        requestAnimationFrame(animate);
      };
    }
  };
  render();
}

        const maxSteps = 15;

          document.getElementById('quickPickName').textContent = rand.name;
          count++;

          if(count >= maxSteps){
            clearInterval(timer);
            groupSelect.disabled = false;
            const winner = pool[Math.floor(Math.random() * pool.length)];
            
            box.innerHTML = `
              <div style="font-size:54px;margin-bottom:8px;">${winner.avatar || '🌟'}</div>
              <div style="font-size:22px;font-weight:800;">${escapeHtml(winner.name)}</div>

            document.getElementById('awardQuickWinnerBtn').onclick = (e)=>{
              winner.points = (winner.points || 0) + 1;
              saveState();
              showToast(`تم إضافة نقطة لـ ${winner.name}`);
              e.target.textContent = `+ منح نقطة أخرى (النقاط: ${winner.points})`;

          }

      }
      document.getElementById('rePickBtn').onclick = doPick;

function firstTwoNames(fullName){
  if(!fullName) return '';
  const parts = String(fullName).trim().split(/\s+/);
  return parts.slice(0, 2).join(' ');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
